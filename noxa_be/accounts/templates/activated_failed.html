<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Verification Failed</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f9;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            text-align: center;
            background: #fff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            max-width: 400px;
            width: 90%;
        }
        .icon {
            font-size: 50px;
            color: #e74c3c; /* Màu đỏ cho trạng thái thất bại */
        }
        .header {
            font-size: 24px;
            margin: 20px 0;
            color: #e74c3c;
        }
        .message {
            font-size: 16px;
            color: #555;
            margin-bottom: 20px;
        }
        .btn {
            display: inline-block;
            padding: 10px 20px;
            font-size: 16px;
            color: #fff;
            background-color: rgba(0, 33, 130, 1);
            text-decoration: none;
            border-radius: 5px;
            transition: background-color 0.3s;
        }
        .btn:hover {
            background-color: rgba(0, 33, 130, 1);
        }
        .form-group {
            margin-top: 20px;
        }
        input[type="email"] {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        input[type="submit"] {
            padding: 10px 20px;
            background-color: rgba(0, 33, 130, 1);
            color: #fff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        input[type="submit"]:hover {
            background-color: rgba(0, 33, 130, 1);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">❌</div>
        <div class="header">Xác thực email thất bại!</div>
        <div class="message">
            Xác thực email không thành công, vui lòng thử lại
        </div>
        <div class="form-group">
            <p>Hoặc nhập email để thử lại:</p>
            <form id="reverify-form">
                <input type="email" name="email" placeholder="Enter your email" required>
                <input type="submit" value="Xác nhận">
            </form>
        </div>
        <div id="response-message" class="message"></div>
    </div>

    <script>
        document.getElementById('reverify-form').addEventListener('submit', function(event) {
            event.preventDefault(); // Prevent the form from submitting the traditional way

            const email = event.target.email.value;
            const responseMessage = document.getElementById('response-message');

            // Construct the URL with the email parameter
            const url = `https://147.182.214.11/api/reverify-email/?email=${encodeURIComponent(email)}`;

            fetch(url, {
                method: 'GET',
                headers: {
                    'Content-Type': 'application/json'
                }
            })
            .then(response => {
                if (response.status === 200) {
                    responseMessage.textContent = 'Email verification link has been sent!';
                    responseMessage.style.color = 'green';
                } else {
                    responseMessage.textContent = 'Failed to send verification link. Please try again.';
                    responseMessage.style.color = 'red';
                }
            })
            .catch(error => {
                responseMessage.textContent = 'An error occurred. Please try again.';
                responseMessage.style.color = 'red';
            });
        });
    </script>
</body>
</html>
